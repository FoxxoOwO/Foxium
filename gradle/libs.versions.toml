[versions]
agp = "8.13.2"
kotlin = "2.3.21"
ksp = "2.3.14"
composeBom = "2026.06.01"
material3 = "1.5.0-alpha17"
coreKtx = "1.17.0"
activityCompose = "1.11.0"
lifecycle = "2.9.4"
room = "2.8.5"
hilt = "2.57.2"
hiltNavigationCompose = "1.2.0"
datastore = "1.1.7"
serializationJson = "1.8.1"
coroutines = "1.10.2"
profileinstaller = "1.4.1"
geckoview = "146.0.20251201213807"
okhttp = "4.12.0"
cast = "22.3.1"
ktor = "3.2.3"
junit = "4.13.2"
androidxTestRunner = "1.7.0"
