<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Autofill test</title>
  <style>
    body { font-family: sans-serif; padding: 24px; }
    input { display: block; width: 100%; padding: 14px; margin: 12px 0; font-size: 18px; }
    button { padding: 14px 32px; font-size: 18px; }
  </style>
</head>
<body>
  <h1>Sign in</h1>
  <form id="f">
    <input id="u" name="username" type="text" autocomplete="username" placeholder="Username">
    <input id="p" name="password" type="password" autocomplete="current-password" placeholder="Password">
    <button id="b" type="submit">Sign in</button>
  </form>
  <p id="log">idle</p>
  <script>
    const params = new URLSearchParams(location.search);
    if (params.has('focus')) {
      setTimeout(() => document.getElementById('u').focus(), 500);
    }
    if (params.has('submit')) {
      setTimeout(() => {
        document.getElementById('u').value = 'demo';
        document.getElementById('p').value = 'secret123';
        document.getElementById('f').requestSubmit();
      }, 1500);
    }
    document.getElementById('f').addEventListener('submit', (e) => {
      e.preventDefault();
      document.getElementById('log').textContent =
        'submitted user=' + document.getElementById('u').value +
        ' pass=' + (document.getElementById('p').value ? 'yes' : 'no');
    });
  </script>
</body>
</html>
