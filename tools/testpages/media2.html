<!doctype html>
<html><head><meta name="viewport" content="width=device-width, initial-scale=1"><title>Autoplay media</title></head>
<body style="font-family:sans-serif;padding:24px">
<h1>Autoplay media</h1>
<audio id="a" loop muted src="tone.wav"></audio>
<p id="log">idle</p>
<script>
const a = document.getElementById('a'), log = document.getElementById('log');
a.play().then(() => log.textContent = 'playing').catch(e => log.textContent = 'error ' + e.name);
document.addEventListener('click', () => { a.muted = false; a.play().then(() => log.textContent = 'playing').catch(e => log.textContent = 'error ' + e.name); });
</script>
</body></html>
