<!doctype html>
<html>
<head><meta name="viewport" content="width=device-width, initial-scale=1"><title>Fullscreen test</title></head>
<body style="font-family: sans-serif; padding: 24px">
  <h1>Fullscreen test</h1>
  <button id="go" style="font-size: 20px; padding: 16px 32px"
          onclick="document.getElementById('box').requestFullscreen()">Go fullscreen</button>
  <div id="box" style="margin-top: 24px; height: 240px; background: #2f6f4f; color: #fff;
                       font-size: 28px; display: flex; align-items: center; justify-content: center">
    FULLSCREEN CONTENT
  </div>
</body>
</html>
